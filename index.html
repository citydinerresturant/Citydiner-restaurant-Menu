.rs{font-family:Cinzel,serif;letter-spacing:4px;color:var(--gh);font-size:13px;margin-top:2px}
.tag{font-style:italic;font-size:13px;color:var(--td);margin:6px 0 clamp(14px,3dvh,22px)}
.qr{--s:22px;--o:-7px;--w:3px;position:relative;display:block;width:fit-content;margin:0 auto clamp(12px,2.4dvh,18px);padding:14px;background:#fdfaf2;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.qrs{display:block;width:clamp(150px,29dvh,230px);height:clamp(150px,29dvh,230px)}
.c{position:absolute;width:var(--s);height:var(--s);border:var(--w) solid var(--g)}
.tl{top:var(--o);left:var(--o);border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.tr{top:var(--o);right:var(--o);border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.bl{bottom:var(--o);left:var(--o);border-right:0;border-top:0;border-radius:0 0 0 6px}
.br{bottom:var(--o);right:var(--o);border-left:0;border-top:0;border-radius:0 0 6px 0}
.cta{font-family:Cinzel,serif;font-weight:600;font-size:15px;color:var(--gh);letter-spacing:.5px}
.sub{font-size:12px;color:var(--tm);line-height:1.5;margin:6px 0 calc(clamp(10px,2.2dvh,16px) + clamp(10px,2dvh,16px))}
.ft{margin-top:0;padding-top:clamp(8px,1.6dvh,12px);border-top:1px solid rgba(201,168,76,.25);font-size:11.5px;color:var(--td);line-height:1.6}
.ft b{color:var(--gh);font-family:Cinzel,serif;letter-spacing:1px}
@media (max-height:620px){.sub{display:none}.cta{margin-bottom:calc(10px + clamp(10px,2dvh,16px))}}
.top{height:41px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;margin-bottom:0}
.top b{font-family:Cinzel,serif;font-size:11px;letter-spacing:2.5px;color:var(--gh);font-weight:600}
.top span{font-style:italic;font-size:11.5px;color:var(--td)}
a:focus-visible{outline:2px solid var(--gh);outline-offset:3px}
